limit_req_zone $binary_remote_addr zone=frontend_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=frontend_conn_per_ip:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8000" always;

    location / {
        limit_req zone=frontend_per_ip burst=20 nodelay;
        limit_conn frontend_conn_per_ip 20;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:env|ini|log|sql|bak|conf|ya?ml|lock)$ {
        deny all;
    }
}
